name: ci

# Push runs also report on pull requests from this repository.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # publishes no floating major tag
        with:
          version: "0.11.14"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: make setup
      - run: make check
      - run: uv run --locked --extra baselines pytest tests/models
      - run: uv run --locked --extra api pytest tests/api
