[project]
name = "hachi"
version = "0.1.0"
description = "Personal physiological forecasting from wearable history, with measured uncertainty and traceable evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=22",
    "pydantic>=2.11",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
models = []
baselines = [
    "scikit-learn>=1.9.1,<1.10",
]
api = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
