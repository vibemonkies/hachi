# Outer-test opening is deliberately unsupported by this development runner.
# Split calibration participants by hash within each inner training cohort.
# Median imputation/scaling/model fit use fit participants only.
# Sigmoid calibration and burden thresholds use calibration participants only.
# Daily negative cutoff exposure is selected survey-confirmed at-risk time;
# it is not population healthy time. Unknown and excluded rows never score.
# Alert episodes merge adjacent daily alerts; lead time retains onset day intervals.
# Selection promotes a candidate only on paired participant-bootstrap AUPRC
# improvement with 95% lower bound > 0, and validation burden <= prespecified cap.
# Otherwise retain prevalence, or report unavailable when calibration lacks classes.
