# Stanford COVID-19 wearables, phase 2 (Alavi et al. 2022): label adapter settings (#8).
# The admitted files (archive and the paper's source data) come from the dataset registry,
# configs/datasets/stanford-covid19-wearables-phase2.toml.
schema_version = "0.1"
pipeline_version = "clinical-labels-2"
dataset_id = "stanford-covid19-wearables-phase2"
archive = "COVID-19-Phase2-Wearables.zip"
labels_workbook = "41591_2021_1593_MOESM3_ESM.xlsx"

# Dates are shifted (some fall in 2027-2028) and times are local wall time in an undisclosed zone.
# Same floating clock as phase 1; see stanford-covid19-wearables.toml.
clock = "floating_local_shifted"

# The release holds only COVID-19-positive participants' test and symptom-onset dates. Daily
# surveys and other illnesses were not released, so every other participant-day is unknown, and
# the onset target here is COVID-19 symptom onset only.
[illness_categories]
"COVID-19" = "covid19"
