# Carnegie Mellon Common Cold Project: five viral-challenge studies plus an aggregated set.
# CMU publishes no release numbers, so the version names the retrieval and the archives are
# pinned by checksum.
schema_version = "0.1"
dataset_id = "cmu-common-cold-project"
name = "Common Cold Project (BCS, PCS1, PCS2, PMBC, PCS3, aggregated Studies 1-5)"
version = "retrieved-2026-10-10"
status = "downloaded"
access = "registration"
primary_url = "https://www.cmu.edu/common-cold-project/data/index.html"
catalog_checked_on = 2026-10-11
citation = "Methods: The data were collected by the Laboratory for the Study of Stress, Immunity, and Disease at Carnegie Mellon University under the directorship of Sheldon Cohen, PhD; and were accessed via the Common Cold Project website (www.commoncoldproject.com; grant number NCCIH AT006694). Reference: Laboratory for the Study of Stress, Immunity, and Disease. (2016). Common Cold Project. Retrieved from http://www.commoncoldproject.com"
acknowledgement = "Per CMU's citation guidance (https://www.cmu.edu/common-cold-project/how-to-cite-data-and-grants/index.html), every acknowledgement cites the Common Cold Project grant NCCIH AT006694, plus the primary and clinical/regulatory grants of each study whose data are used: BCS NIAID R01 AI23072; PCS1/PCS2 NIMH R01 MH50429 and NIH 5M01 RR00056; PMBC NHLBI P01 HL65111 and HL65112; PCS3 NIAID R01 AI066367, NIH UL1 RR024153 and UL1 TR000005 (the CMU page also prints this number as TR0005 and RT000005). Supplementary grants are cited only when an analysis uses variables from the assessments they funded: BCS ONR N00014-88-K-0063 (rubella and HSV-1 antibody); PMBC MacArthur Network (glucocorticoid resistance, Reactive Responding Scale, subjective socioeconomic status ladder, salivary cortisol, urinary catecholamines) and NCI P30CA047904 (catecholamines, cortisol, nasal, serum and stimulated cytokines); PCS3 PA DOH 08-01-2 (genotyping, cytokines, cortisol receptors), NCCIH RC1AT005799 (oxidative stress, telomere length) and MacArthur Network (cellular aging, genotyping)."
access_steps = [
  "Read the CCP Data-Sharing Agreement at https://www.cmu.edu/common-cold-project/data/data-sharing-agreement/index.html.",
  "Complete the CCP registration form yourself; submitting it accepts the agreement. Registration is per person.",
  "Download the study archives from the link CMU sends.",
  "Before analysing, register the planned analysis with CMU's Laboratory for the Study of Stress, Immunity, and Disease using the Data Analysis Form.",
  "After publishing anything, report it with the Data Set Publication Form.",
]
access_owner = "justin06lee"
approved_users = ["justin06lee", "ezzy1630", "CoffeeCoder1015"]
storage = "Outside Git, only where every person with access has accepted the CCP agreement: the access owner's data root and, since all three teammates registered (2026-10-11), the shared GX10 account at ~/hachi/data/cmu-common-cold-project/<version>/. The agreement requires appropriate security; the target is encrypted storage with key-only SSH. As of 2026-10-11 the T7 and the GX10 disk are unencrypted and the GX10 still allows password SSH on a private lab network; the owner accepted this interim state and plans to encrypt and disable password login."
checksum_strategy = "SHA-256 of each downloaded archive as received; ingestion later records per-file checksums of the extracted codebooks and data files."
blocked_capabilities = [
  "Wearable-based illness-onset prediction: the studies contain no wearable signals.",
  "Any analysis before the planned analysis is registered with CMU.",
  "Hosted-LLM processing of participant-level rows.",
  "Giving access to anyone who has not accepted the CCP agreement, including new users of the shared GX10 account.",
]
notes = [
  "Controlled viral-challenge (inoculation) studies of healthy adults aged 18-55, 1986-2011; de-identified. BCS n=399 (rhinoviruses 2, 9, 14, RSV, coronavirus 229E; quarantine to day 6), PCS1 n=276 (RV39/RV21, 5 days), PCS2 n=334 (RV39/RV23, 5 days), PMBC n=193 (influenza A for 38 over 6 days, RV39 for 155 over 5 days), PCS3 n=213 (RV39, 5 days); serum about 28 days after challenge.",
  "Infection: challenge virus recovered from nasal secretions on any post-challenge day, or a 4-fold rise in virus-specific antibody (BCS RSV/coronavirus: >2 SD rise in IgA or IgG).",
  "Clinical cold (Pittsburgh studies): infection plus mucus weight >= 10 g or nasal clearance >= 7 min average, or Modified Jackson total >= 6 with self-reported cold or rhinorrhea on 3+ days. BCS: clinician rating >= 2 of 4 plus symptoms on days 2-6.",
  "Follow-up ends with the 5-6 day quarantine, so most recoveries are right-censored; exact recovery days cannot be trained from it.",
  "The DSA says planned analyses will be registered; the FAQ calls the analysis form a request. Register before analysing (safe reading). The CMU site states it is no longer maintained.",
  "Never read participant-level rows into a hosted LLM conversation: passing data to a provider that has not accepted the agreement is passing it to a third party. Agents work through code and aggregate counts only.",
  "Also contains evening-interview social-activity data (PMBC and PCS3); not used by Hachi.",
]

