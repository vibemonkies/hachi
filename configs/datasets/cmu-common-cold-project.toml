[[tasks]]
task = "recovery"
role = "outcome_labels"
notes = "Symptom-resolution endpoints after a known inoculation time, with right-censoring at the end of quarantine. Supports a symptom-only recovery baseline; no wearable predictors."

[[tasks]]
task = "illness_onset"
role = "exploratory"
notes = "Shows how symptom-onset and clinical-cold definitions behave against lab-confirmed infection. Cannot train or evaluate wearable onset prediction."
