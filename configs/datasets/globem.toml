citation = "Xu X, et al. GLOBEM Dataset: Multi-Year Datasets for Longitudinal Human Behavior Modeling Generalization (version 1.1). PhysioNet (2023). doi:10.13026/r9s1-s711; Xu X et al., NeurIPS 2022 Datasets and Benchmarks; plus the standard PhysioNet citation shown on the project page."
access_steps = [
  "Use the same PhysioNet credential as CovIdentify (account, CITI 'Data or Specimens Only Research' report, credentialing application with a reference).",
  "Sign the PhysioNet Credentialed Health Data Use Agreement 1.5.0 on the GLOBEM project page.",
  "Download. Each teammate is credentialed individually.",
]
access_owner = "justin06lee"
approved_users = []
storage = "Only machines and accounts used solely by one credentialed user who signed the DUA. Never the shared GX10 Unix account, even if all three are credentialed: the DUA forbids sharing access and a shared login is sharing. Per-person GX10 accounts would be needed."
checksum_strategy = "SHA-256 per file, compared with PhysioNet's SHA256SUMS.txt."
blocked_capabilities = []
notes = [
  "497 participants, 705 person-years across four yearly cohorts (2018-2021), about 77 days each, as daily Fitbit and phone features (steps, sleep).",
  "No heart rate and no illness labels; weekly wellbeing and depression surveys.",
  "Recommended: the largest longitudinal daily-Fitbit set for next-day steps/sleep forecasting and personal-baseline anomaly evaluation, at no extra credentialing cost once CovIdentify access exists.",
]

