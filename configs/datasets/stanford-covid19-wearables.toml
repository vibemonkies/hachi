  "Read the archive's README for any data terms before using it.",
  "Download the paper's Supplementary Data 1, https://static-content.springer.com/esm/art%3A10.1038%2Fs41551-020-00640-6/MediaObjects/41551_2020_640_MOESM3_ESM.xlsx (4,041,311 bytes). It holds the outcome labels: Supplementary Table 3 (category, symptom-onset, diagnosis and recovery dates) and Table 5 (daily symptom surveys). The archive itself has no labels.",
